[workspace]
resolver = "2"
members = [
    "crates/worldforge-core",
    "crates/worldforge-ecs",
    "crates/worldforge-world",
    "crates/worldforge-runtime",
    "crates/worldforge-replay",
    "crates/worldforge-package",
    "crates/worldforge-mod-api",
    "crates/worldforge-mod-runtime",
    "crates/worldforge-economy",
    "crates/worldforge-agent",
    "crates/worldforge-proof",
    "crates/worldforge-cli",
    "crates/worldforge-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hardonian/WorldForge"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
worldforge-core = { version = "0.2.0", path = "crates/worldforge-core" }
worldforge-ecs = { version = "0.2.0", path = "crates/worldforge-ecs" }
worldforge-world = { version = "0.2.0", path = "crates/worldforge-world" }
worldforge-runtime = { version = "0.2.0", path = "crates/worldforge-runtime" }
worldforge-replay = { version = "0.2.0", path = "crates/worldforge-replay" }
worldforge-package = { version = "0.2.0", path = "crates/worldforge-package" }
worldforge-mod-api = { version = "0.2.0", path = "crates/worldforge-mod-api" }
worldforge-mod-runtime = { version = "0.2.0", path = "crates/worldforge-mod-runtime" }
worldforge-economy = { version = "0.2.0", path = "crates/worldforge-economy" }
worldforge-agent = { version = "0.2.0", path = "crates/worldforge-agent" }
worldforge-proof = { version = "0.2.0", path = "crates/worldforge-proof" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

# Hashing
blake3 = "1"

# RNG
rand = "0.8"
rand_chacha = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors
thiserror = "1"

# Versioning
semver = { version = "1", features = ["serde"] }

# Time (metadata only)
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }

# Archive
tar = "0.4"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
