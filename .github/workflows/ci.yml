name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.88.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  determinism:
    name: Determinism Verification
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p worldforge-cli --release
      - name: Run supply-chain determinism test
        run: |
          target/release/worldforge test-world examples/supply-chain --runs 20 --ticks 1000
      - name: Run minimal-world determinism test
        run: |
          target/release/worldforge test-world examples/minimal-world --runs 5 --ticks 10
      - name: Run city campaign determinism test
        run: |
          target/release/worldforge test-world examples/micro-city --runs 20 --ticks 1500
      - name: Validate example worlds
        run: |
          for world in examples/*; do
            if [ -f "$world/world.toml" ]; then
              target/release/worldforge validate "$world"
            fi
          done
      - name: Build and inspect package
        run: |
          target/release/worldforge package build examples/supply-chain
          target/release/worldforge package inspect examples/supply-chain.world
      - name: Run and verify replay
        run: |
          target/release/worldforge run examples/supply-chain --seed 42 --ticks 500
          target/release/worldforge replay verify examples/supply-chain/last.replay
