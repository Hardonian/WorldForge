# City-builder simulation: power + water + housing → population + economy

[[entities]]
name = "city-hall"
entity_type = "civic-core"
region = "downtown"

[entities.initial_inventory]
credits = 6000.0
materials = 900.0
research = 180.0
power = 300.0
clean_water = 300.0
food = 300.0
population = 40.0

[[entities]]
name = "coal-plant"
entity_type = "producer"
region = "industrial"

[entities.initial_inventory]
coal = 5000.0
power = 200.0

[entities.production]
energy_cost = 0.0

[entities.production.inputs]
coal = 5.0

[entities.production.outputs]
power = 20.0

[[entities]]
name = "solar-farm"
entity_type = "producer"
region = "outskirts"

[entities.initial_inventory]
sunlight = 99999.0
power = 50.0

[entities.production]
energy_cost = 0.0

[entities.production.inputs]
sunlight = 1.0

[entities.production.outputs]
power = 5.0

[[entities]]
name = "water-plant"
entity_type = "processor"
region = "riverside"

[entities.initial_inventory]
raw_water = 10000.0
clean_water = 300.0
power = 100.0

[entities.production]
energy_cost = 2.0

[entities.production.inputs]
raw_water = 10.0
power = 2.0

[entities.production.outputs]
clean_water = 8.0

[[entities]]
name = "residential-zone"
entity_type = "consumer"
region = "downtown"

[entities.initial_inventory]
power = 100.0
clean_water = 200.0
food = 300.0
population = 200.0
happiness = 80.0

[entities.production]
energy_cost = 0.0

[entities.production.inputs]
power = 3.0
clean_water = 2.0
food = 2.0

[entities.production.outputs]
population = 1.0
happiness = 1.0

[[entities]]
name = "commercial-zone"
entity_type = "processor"
region = "downtown"

[entities.initial_inventory]
power = 50.0
population = 0.0
money = 1000.0
goods = 200.0

[entities.production]
energy_cost = 1.0

[entities.production.inputs]
power = 2.0
goods = 1.0

[entities.production.outputs]
money = 15.0

[[entities]]
name = "farm"
entity_type = "producer"
region = "outskirts"

[entities.initial_inventory]
clean_water = 500.0
food = 400.0

[entities.production]
energy_cost = 0.0

[entities.production.inputs]
clean_water = 3.0

[entities.production.outputs]
food = 5.0

[[entities]]
name = "warehouse"
entity_type = "storage"
region = "industrial"

[entities.initial_inventory]
goods = 500.0
food = 200.0

# Infrastructure links
[[links]]
from = "coal-plant"
to = "water-plant"
resource = "power"
max_per_tick = 8.0

[[links]]
from = "coal-plant"
to = "residential-zone"
resource = "power"
max_per_tick = 10.0

[[links]]
from = "solar-farm"
to = "residential-zone"
resource = "power"
max_per_tick = 5.0

[[links]]
from = "solar-farm"
to = "commercial-zone"
resource = "power"
max_per_tick = 3.0

[[links]]
from = "water-plant"
to = "residential-zone"
resource = "clean_water"
max_per_tick = 6.0

[[links]]
from = "water-plant"
to = "farm"
resource = "clean_water"
max_per_tick = 5.0

[[links]]
from = "farm"
to = "residential-zone"
